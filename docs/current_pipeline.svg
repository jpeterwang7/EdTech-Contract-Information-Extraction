<svg xmlns="http://www.w3.org/2000/svg" viewBox="-25 0 960 750" width="960" height="750"><style>text{font-family:-apple-system,Helvetica,sans-serif;text-anchor:middle}.th{font-size:14px;font-weight:600}.ts{font-size:12px}.chk{fill:none;stroke:#BA7517;stroke-width:1.2;stroke-dasharray:5 3}</style><rect x="-25" width="960" height="750" fill="white"/><defs><marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#888780" stroke-width="1.5"/></marker><marker id="aa" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#BA7517" stroke-width="1.5"/></marker></defs><rect x="170" y="30" width="340" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="340.0" y="50" class="th" fill="#2C2C2A">EdTech contracts</text><text x="340.0" y="70" class="ts" fill="#5F5E5A">PDFs, scanned or digital</text><line x1="340" y1="86" x2="340" y2="114" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/><rect x="170" y="116" width="340" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="340.0" y="136" class="th" fill="#2C2C2A">Read every page</text><text x="340.0" y="156" class="ts" fill="#5F5E5A">Text layer, or OCR: Tesseract + Apple Vision</text><line x1="340" y1="172" x2="340" y2="200" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/><rect x="170" y="202" width="340" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="340.0" y="222" class="th" fill="#2C2C2A">Clean text into blocks</text><text x="340.0" y="242" class="ts" fill="#5F5E5A">Paragraphs, headings, form rows; tables to Excel</text><line x1="340" y1="258" x2="340" y2="286" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/><rect x="170" y="288" width="340" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="340.0" y="308" class="th" fill="#2C2C2A">Judge one block at a time</text><text x="340.0" y="328" class="ts" fill="#5F5E5A">Headings skipped; shown to Llama as context</text><line x1="300" y1="344" x2="160" y2="372" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/><line x1="340" y1="344" x2="340" y2="372" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/><line x1="380" y1="344" x2="520" y2="372" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/><path d="M510 316H795V372" class="chk" marker-end="url(#aa)"/><rect x="50" y="374" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="140.0" y="394" class="th" fill="#3C3489">Term list (regex)</text><text x="140.0" y="414" class="ts" fill="#534AB7">Has a privacy term?</text><rect x="250" y="374" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="340.0" y="394" class="th" fill="#3C3489">Llama 3.1 8B</text><text x="340.0" y="414" class="ts" fill="#534AB7">Says yes?</text><rect x="450" y="374" width="180" height="56" rx="8" fill="#EEEDFE" stroke="#534AB7" stroke-width="0.8"/><text x="540.0" y="394" class="th" fill="#3C3489">Semantic similarity</text><text x="540.0" y="414" class="ts" fill="#534AB7">Close to the definition?</text><rect x="685" y="374" width="220" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8" stroke-dasharray="5 3"/><text x="795.0" y="394" class="th" fill="#633806">Person's judgement</text><text x="795.0" y="414" class="ts" fill="#854F0B">Privacy or not? Votes unseen</text><line x1="160" y1="430" x2="280" y2="458" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/><line x1="340" y1="430" x2="340" y2="458" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/><line x1="520" y1="430" x2="400" y2="458" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/><rect x="170" y="460" width="340" height="44" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="340.0" y="487.0" class="th" fill="#2C2C2A">Count yes votes per block</text><line x1="300" y1="504" x2="160" y2="540" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/><line x1="340" y1="504" x2="340" y2="540" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/><line x1="380" y1="504" x2="520" y2="540" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/><rect x="50" y="542" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="140.0" y="562" class="th" fill="#085041">2–3 yes: kept</text><text x="140.0" y="582" class="ts" fill="#0F6E56">Automatic</text><rect x="250" y="542" width="180" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="340.0" y="562" class="th" fill="#085041">1 yes: person checks</text><text x="340.0" y="582" class="ts" fill="#0F6E56">Kept if they say yes</text><rect x="450" y="542" width="180" height="56" rx="8" fill="#F1EFE8" stroke="#5F5E5A" stroke-width="0.8"/><text x="540.0" y="562" class="th" fill="#2C2C2A">0 yes: dropped</text><text x="540.0" y="582" class="ts" fill="#5F5E5A">Automatic</text><path d="M795 430V636" class="chk" marker-end="url(#aa)"/><line x1="160" y1="598" x2="280" y2="636" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/><line x1="340" y1="598" x2="340" y2="636" stroke="#888780" stroke-width="1.2" marker-end="url(#ar)"/><rect x="170" y="638" width="340" height="56" rx="8" fill="#E1F5EE" stroke="#0F6E56" stroke-width="0.8"/><text x="340.0" y="658" class="th" fill="#085041">Privacy blocks</text><text x="340.0" y="678" class="ts" fill="#0F6E56">Items keep their lead-in; input to fact extraction</text><path d="M510 666H683" class="chk" marker-end="url(#aa)"/><text x="597" y="658" class="ts" fill="#854F0B">final blocks</text><rect x="685" y="638" width="220" height="56" rx="8" fill="#FAEEDA" stroke="#854F0B" stroke-width="0.8" stroke-dasharray="5 3"/><text x="795.0" y="658" class="th" fill="#633806">Pipeline vs person</text><text x="795.0" y="678" class="ts" fill="#854F0B">Same yes or no for each block?</text><line x1="286" y1="727" x2="316" y2="727" class="chk"/><text x="324" y="731" class="ts" fill="#5F5E5A" style="text-anchor:start">Dashed: checking the pipeline against a person; not part of a normal run</text></svg>
